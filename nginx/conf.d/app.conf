# Upstreams (cleaner than repeating proxy_pass)
upstream next_app {
  server app:3000;
  keepalive 32;
}

# Optional: for WebSocket/SSE upgrades (Next devtools or realtime later)
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # --- ACME challenge for Let's Encrypt ---
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    default_type "text/plain";
    try_files $uri =404;
  }

  # --- Security / sane defaults ---
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  # --- Recordings: serve files directly (fast, supports Range/seek) ---
  # URL: /recordings/cam4/file.mp4 (or .mkv if you still have them)
  location ^~ /recordings/ {
    alias /recordings/;
    autoindex off;

    # do NOT fall back to app; recordings are not app routes
    try_files $uri =404;

    # video-friendly caching (tweak to your taste)
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;

    # If you later add auth in the app, you can restrict here by IP/basic auth/etc.
  }

  location ^~ /go2rtc/ {
    # IMPORTANT: keep the trailing slash!
    proxy_pass http://media:1984/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websocket support (go2rtc can use WS for WebRTC)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # --- Web App (UI + API) ---
  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket/SSE compatibility (safe to keep)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # reasonable timeouts for UI/API
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
